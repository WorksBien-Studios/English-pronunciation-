<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>冒険マップ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:"Hiragino Maru Gothic ProN","HiraMaruProN-W4","Noto Sans JP",sans-serif;background:#6FD0F7}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.4);opacity:0}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#5CC6F5 0%,#9BE3FF 60%,#BDEEFF 100%);color:#1B1F5E;font-family:'Hiragino Maru Gothic ProN','HiraMaruProN-W4','Noto Sans JP',sans-serif">

  <svg width="390" height="844" viewBox="0 0 390 844" style="position:absolute;left:0;top:0" aria-hidden="true">
    <defs>
      <pattern id="sei" width="40" height="20" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.6">
          <circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="12"/><circle cx="20" cy="20" r="6"/>
          <circle cx="0" cy="10" r="18"/><circle cx="0" cy="10" r="12"/><circle cx="0" cy="10" r="6"/>
          <circle cx="40" cy="10" r="18"/><circle cx="40" cy="10" r="12"/><circle cx="40" cy="10" r="6"/>
        </g></pattern>
    </defs>
    <rect width="390" height="844" fill="url(#sei)"/>
    <!-- clouds -->
    <g fill="#fff" fill-opacity="0.9"><ellipse cx="320" cy="150" rx="40" ry="14"/><ellipse cx="345" cy="140" rx="24" ry="14"/><ellipse cx="60" cy="200" rx="34" ry="11"/><ellipse cx="80" cy="192" rx="20" ry="12"/></g>
    <!-- island C -->
    <ellipse cx="172" cy="290" rx="158" ry="96" fill="#FFE7A3" stroke="#1B1F5E" stroke-width="3.5"/>
    <ellipse cx="172" cy="284" rx="140" ry="82" fill="#82DC5A" stroke="#1B1F5E" stroke-width="3"/>
    <ellipse cx="150" cy="264" rx="70" ry="30" fill="#A6EE7C" fill-opacity="0.7"/>
    <!-- island B -->
    <ellipse cx="215" cy="472" rx="158" ry="90" fill="#FFE7A3" stroke="#1B1F5E" stroke-width="3.5"/>
    <ellipse cx="215" cy="466" rx="140" ry="76" fill="#82DC5A" stroke="#1B1F5E" stroke-width="3"/>
    <ellipse cx="240" cy="446" rx="66" ry="26" fill="#A6EE7C" fill-opacity="0.7"/>
    <!-- island A -->
    <ellipse cx="185" cy="648" rx="158" ry="90" fill="#FFE7A3" stroke="#1B1F5E" stroke-width="3.5"/>
    <ellipse cx="185" cy="642" rx="140" ry="76" fill="#82DC5A" stroke="#1B1F5E" stroke-width="3"/>
    <ellipse cx="160" cy="622" rx="66" ry="26" fill="#A6EE7C" fill-opacity="0.7"/>
    <!-- trees -->
    <g stroke="#1B1F5E" stroke-width="2.5"><circle cx="300" cy="250" r="17" fill="#2FA85A"/><circle cx="52" cy="330" r="15" fill="#2FA85A"/><circle cx="330" cy="500" r="16" fill="#2FA85A"/><circle cx="78" cy="520" r="14" fill="#2FA85A"/><circle cx="325" cy="668" r="16" fill="#2FA85A"/><circle cx="46" cy="690" r="14" fill="#2FA85A"/></g>
    <!-- road -->
    <path d="M105 660 C170 645 230 640 265 598 C300 545 150 545 120 484 C90 430 250 474 290 432 C320 384 170 372 150 304" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 16" stroke-opacity="0.95"/>
  </svg>

  <!-- HUD -->
  <div style="position:absolute;left:12px;right:12px;top:54px;display:flex;align-items:center;gap:8px">
    <div style="width:50px;height:50px;border-radius:25px;background:linear-gradient(#FFE066,#FFC933);border:3px solid #1B1F5E;box-shadow:0 3px 0 #C48A00;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1">
      <span style="font-size:10px;font-weight:800">Lv</span><span style="font-size:20px;font-weight:800">7</span></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:3px">
      <div style="font-size:11px;font-weight:800;color:#fff;-webkit-text-stroke:3px #1B1F5E;paint-order:stroke fill">つぎのレベルまで 40 EXP</div>
      <div style="height:14px;border-radius:7px;background:#fff;border:3px solid #1B1F5E;overflow:hidden;box-sizing:border-box"><div style="width:68%;height:100%;background:linear-gradient(90deg,#3DDBB3,#12B5A4)"></div></div>
    </div>
    <div style="height:38px;padding:0 10px;border-radius:19px;background:#fff;border:3px solid #1B1F5E;box-shadow:0 3px 0 #9fa6d6;display:flex;align-items:center;gap:5px;font-size:15px;font-weight:800">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E5372B" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>7/10</div>
  </div>

  <!-- omikuji -->
  <a href="Omikuji.dc.html" style="position:absolute;right:14px;top:112px;width:60px;height:60px;border-radius:30px;background:linear-gradient(#FF7A6B,#E5372B);border:3px solid #1B1F5E;box-shadow:0 4px 0 #9E1F16;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#fff;line-height:1.05">
    <span style="font-size:10px;font-weight:800">今日の</span><span style="font-size:14px;font-weight:800">おみくじ</span></a>

  <!-- boss node -->
  <div style="position:absolute;left:112px;top:262px;width:76px;height:76px;border-radius:38px;background:linear-gradient(#C9CDE0,#A7ADCB);border:3.5px solid #1B1F5E;box-shadow:0 5px 0 #7d84ad;display:flex;align-items:center;justify-content:center">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1B1F5E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="#fff"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <div style="position:absolute;left:104px;top:340px;width:92px;text-align:center;font-size:12px;font-weight:800;color:#fff;-webkit-text-stroke:3.5px #1B1F5E;paint-order:stroke fill">しあげテスト</div>

  <!-- node 4 locked -->
  <div style="position:absolute;left:260px;top:406px;width:60px;height:60px;border-radius:30px;background:linear-gradient(#C9CDE0,#A7ADCB);border:3.5px solid #1B1F5E;box-shadow:0 4px 0 #7d84ad;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#5a608a">4</div>

  <!-- node 3 current -->
  <div style="position:absolute;left:78px;top:436px;width:84px;height:84px">
    <div style="position:absolute;inset:0;border-radius:50%;border:4px solid #fff;animation:pulse 1.8s ease-out infinite"></div>
    <div style="position:absolute;inset:0;border-radius:42px;background:radial-gradient(#fff,#E9F7FF);border:4px solid #1B1F5E;box-shadow:0 5px 0 #1B1F5E;display:flex;align-items:center;justify-content:center">
      <div style="animation:bob 1.6s ease-in-out infinite"><dc-import name="Creature" type="r" size="66" hint-size="66px,66px"></dc-import></div></div>
  </div>
  <div style="position:absolute;left:44px;top:396px;width:152px;height:32px;border-radius:16px;background:linear-gradient(#FFE066,#FFC933);border:3px solid #1B1F5E;box-shadow:0 3px 0 #C48A00;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">つづきから！</div>
  <div style="position:absolute;left:108px;top:424px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #1B1F5E"></div>
  <div style="position:absolute;left:111px;top:424px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #FFC933"></div>
  <div style="position:absolute;left:66px;top:524px;width:108px;text-align:center;font-size:13px;font-weight:800;color:#fff;-webkit-text-stroke:3.5px #1B1F5E;paint-order:stroke fill">R の森</div>

  <!-- node 2 done -->
  <div style="position:absolute;left:235px;top:568px;width:60px;height:60px;border-radius:30px;background:linear-gradient(#FFE066,#FFC933);border:3.5px solid #1B1F5E;box-shadow:0 4px 0 #C48A00;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800">2</div>
  <div style="position:absolute;left:232px;top:632px;width:66px;display:flex;justify-content:center;gap:1px">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1l2.6 6.2 6.7.4-5.1 4.4 1.7 6.6L10 15l-5.9 3.6 1.7-6.6L.7 7.6l6.7-.4z" fill="#FFD24D" stroke="#1B1F5E" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1l2.6 6.2 6.7.4-5.1 4.4 1.7 6.6L10 15l-5.9 3.6 1.7-6.6L.7 7.6l6.7-.4z" fill="#FFD24D" stroke="#1B1F5E" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1l2.6 6.2 6.7.4-5.1 4.4 1.7 6.6L10 15l-5.9 3.6 1.7-6.6L.7 7.6l6.7-.4z" fill="#fff" fill-opacity="0.75" stroke="#1B1F5E" stroke-width="1.6" stroke-linejoin="round"/></svg></div>

  <!-- node 1 done -->
  <div style="position:absolute;left:75px;top:630px;width:60px;height:60px;border-radius:30px;background:linear-gradient(#FFE066,#FFC933);border:3.5px solid #1B1F5E;box-shadow:0 4px 0 #C48A00;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800">1</div>
  <div style="position:absolute;left:72px;top:694px;width:66px;display:flex;justify-content:center;gap:1px">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1l2.6 6.2 6.7.4-5.1 4.4 1.7 6.6L10 15l-5.9 3.6 1.7-6.6L.7 7.6l6.7-.4z" fill="#FFD24D" stroke="#1B1F5E" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1l2.6 6.2 6.7.4-5.1 4.4 1.7 6.6L10 15l-5.9 3.6 1.7-6.6L.7 7.6l6.7-.4z" fill="#FFD24D" stroke="#1B1F5E" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1l2.6 6.2 6.7.4-5.1 4.4 1.7 6.6L10 15l-5.9 3.6 1.7-6.6L.7 7.6l6.7-.4z" fill="#FFD24D" stroke="#1B1F5E" stroke-width="1.6" stroke-linejoin="round"/></svg></div>

  <!-- coach cheering -->
  <div style="position:absolute;right:10px;top:690px;animation:bob 2s ease-in-out infinite"><dc-import name="Coach" mood="cheer" size="70" hint-size="70px,70px"></dc-import></div>

  <div style="position:absolute;left:0;bottom:0"><dc-import name="PhoneTabs" active="0" hint-size="390px,83px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
