<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>コーチ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:transparent}
</style>
</helmet>
<div style="width:{{px}};height:{{px}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">
  <ellipse cx="50" cy="95" rx="26" ry="3.6" fill="rgba(27,31,94,0.18)"/>
  <path d="M24 74 L12 92 L42 80 Z" fill="#fff" stroke="#1B1F5E" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="8" y="16" width="84" height="64" rx="30" fill="#fff" stroke="#1B1F5E" stroke-width="3.5"/>
  <path d="M24 74 L40 79" stroke="#fff" stroke-width="6"/>
  <path d="M34 16 q5 -14 10 0 t10 0 t10 0" fill="none" stroke="#12B5A4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 34 q6 -4 12 0" fill="none" stroke="#3D42C9" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <sc-if value="{{isHappy}}" hint-placeholder-val="{{ true }}">
    <path d="M28 50 q6 -8 12 0 M60 50 q6 -8 12 0" fill="none" stroke="#1B1F5E" stroke-width="4" stroke-linecap="round"/>
    <path d="M42 60 q8 10 16 0" fill="none" stroke="#1B1F5E" stroke-width="4" stroke-linecap="round"/>
  </sc-if>
  <sc-if value="{{isCheer}}" hint-placeholder-val="{{ false }}">
    <path d="M27 44 l10 6 -10 6 M73 44 l-10 6 10 6" fill="none" stroke="#1B1F5E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M43 60 q7 11 14 0 z" fill="#1B1F5E" stroke="#1B1F5E" stroke-width="2" stroke-linejoin="round"/>
    <path d="M47 64.5 q3 2.4 6 0" fill="none" stroke="#FF8FA3" stroke-width="3" stroke-linecap="round"/>
  </sc-if>
  <sc-if value="{{isWow}}" hint-placeholder-val="{{ false }}">
    <circle cx="34" cy="50" r="6.5" fill="#1B1F5E"/><circle cx="66" cy="50" r="6.5" fill="#1B1F5E"/>
    <circle cx="36" cy="48" r="2.2" fill="#fff"/><circle cx="68" cy="48" r="2.2" fill="#fff"/>
    <ellipse cx="50" cy="64" rx="5" ry="6" fill="#1B1F5E"/>
  </sc-if>
  <ellipse cx="22" cy="60" rx="6.5" ry="4.2" fill="#FFB3C7"/><ellipse cx="78" cy="60" rx="6.5" ry="4.2" fill="#FFB3C7"/>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["happy","cheer","wow"],"default":"happy"},"size":{"editor":"int","default":96},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mood || 'happy';
    const size = Number(this.props.size || 96);
    return { px: size + 'px', isHappy: m === 'happy', isCheer: m === 'cheer', isWow: m === 'wow' };
  }
}
</script>
</body>
</html>
