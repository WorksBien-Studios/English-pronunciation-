<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>音のなかま</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:transparent}
</style>
</helmet>
<div style="width:{{px}};height:{{px}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">
  <ellipse cx="50" cy="94" rx="27" ry="4" fill="rgba(27,31,94,0.18)"/>

  <!-- silhouette features (drawn behind the body; also visible on locked entries) -->
  <sc-if value="{{tL}}" hint-placeholder-val="{{ false }}">
    <path d="M50 26 L50 14" fill="none" stroke="#1B1F5E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="10" r="6.2" fill="{{accent}}" stroke="#1B1F5E" stroke-width="3"/>
  </sc-if>
  <sc-if value="{{tR}}" hint-placeholder-val="{{ true }}">
    <path d="M50 26 C42 12 60 2 62 14 C63 22 54 22 54 16" fill="none" stroke="#1B1F5E" stroke-width="4" stroke-linecap="round"/>
  </sc-if>
  <sc-if value="{{tTH}}" hint-placeholder-val="{{ false }}">
    <circle cx="24" cy="30" r="9.5" fill="{{body}}" stroke="#1B1F5E" stroke-width="3.5"/><circle cx="76" cy="30" r="9.5" fill="{{body}}" stroke="#1B1F5E" stroke-width="3.5"/>
  </sc-if>
  <sc-if value="{{tV}}" hint-placeholder-val="{{ false }}">
    <path d="M20 40 L17 15 L40 28 Z" fill="{{body}}" stroke="#1B1F5E" stroke-width="3.5" stroke-linejoin="round"/><path d="M80 40 L83 15 L60 28 Z" fill="{{body}}" stroke="#1B1F5E" stroke-width="3.5" stroke-linejoin="round"/>
  </sc-if>
  <sc-if value="{{tF}}" hint-placeholder-val="{{ false }}">
    <path d="M50 26 C39 16 44 3 58 5 C61 16 57 23 50 26 Z" fill="{{leaf}}" stroke="#1B1F5E" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M51 22 C51 17 53 12 56 8" fill="none" stroke="#1B1F5E" stroke-width="2" stroke-linecap="round"/>
  </sc-if>
  <sc-if value="{{tB}}" hint-placeholder-val="{{ false }}">
    <circle cx="58" cy="13" r="8" fill="#fff" fill-opacity="0.85" stroke="#1B1F5E" stroke-width="3"/><path d="M54.5 11 q1.5 -3 4 -3" fill="none" stroke="#1B1F5E" stroke-width="1.8" stroke-linecap="round"/><circle cx="43" cy="9" r="3.6" fill="#fff" fill-opacity="0.85" stroke="#1B1F5E" stroke-width="2.4"/>
  </sc-if>

  <ellipse cx="50" cy="57" rx="37" ry="34" fill="{{body}}" stroke="#1B1F5E" stroke-width="3.5"/>
  <sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
    <text x="50" y="72" text-anchor="middle" font-size="44" font-weight="700" fill="#F4F5FB">?</text>
  </sc-if>

  <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
    <ellipse cx="34" cy="38" rx="11" ry="6" fill="#fff" fill-opacity="0.38" transform="rotate(-24 34 38)"/>
    <ellipse cx="36" cy="53" rx="6.4" ry="7.6" fill="#1B1F5E"/><ellipse cx="64" cy="53" rx="6.4" ry="7.6" fill="#1B1F5E"/>
    <circle cx="38.2" cy="50" r="2.7" fill="#fff"/><circle cx="66.2" cy="50" r="2.7" fill="#fff"/>
    <circle cx="34.2" cy="57.2" r="1.3" fill="#fff"/><circle cx="62.2" cy="57.2" r="1.3" fill="#fff"/>
    <ellipse cx="24" cy="66" rx="6" ry="4" fill="#FFB3C7"/><ellipse cx="76" cy="66" rx="6" ry="4" fill="#FFB3C7"/>
  </sc-if>

  <!-- resting mouth: small closed "ω" smile for every creature -->
  <sc-if value="{{isRest}}" hint-placeholder-val="{{ true }}">
    <path d="M43 67 q3.5 4.5 7 0 q3.5 4.5 7 0" fill="none" stroke="#1B1F5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </sc-if>
  <sc-if value="{{restTH}}" hint-placeholder-val="{{ false }}">
    <circle cx="64" cy="53" r="10.5" fill="{{body}}"/>
    <path d="M56 55 q8 -9 16 0" fill="none" stroke="#1B1F5E" stroke-width="3.6" stroke-linecap="round"/>
    <ellipse cx="58" cy="73.5" rx="3.6" ry="4.6" fill="#FF8FA3" stroke="#1B1F5E" stroke-width="2"/>
  </sc-if>
  <sc-if value="{{restV}}" hint-placeholder-val="{{ false }}">
    <path d="M43.5 68.5 h4.5 l-2.2 5.5 z" fill="#fff" stroke="#1B1F5E" stroke-width="1.8" stroke-linejoin="round"/>
  </sc-if>
  <sc-if value="{{restB}}" hint-placeholder-val="{{ false }}">
    <ellipse cx="22" cy="67" rx="8" ry="6" fill="#FFB3C7"/><ellipse cx="78" cy="67" rx="8" ry="6" fill="#FFB3C7"/>
  </sc-if>

  <!-- joy: happy closed "^ ^" eyes with a small open smile, celebration only -->
  <sc-if value="{{isJoy}}" hint-placeholder-val="{{ false }}">
    <circle cx="36" cy="53" r="10.5" fill="{{body}}"/><circle cx="64" cy="53" r="10.5" fill="{{body}}"/>
    <path d="M28 55 q8 -10 16 0 M56 55 q8 -10 16 0" fill="none" stroke="#1B1F5E" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M42 63 Q50 78 58 63 Z" fill="#7A1F10" stroke="#1B1F5E" stroke-width="2.4" stroke-linejoin="round"/>
    <ellipse cx="50" cy="71.5" rx="4.5" ry="2.8" fill="#FF8FA3"/>
  </sc-if>

  <!-- teaching mouth: shows the articulation, used only on cue screens -->
  <sc-if value="{{showR}}" hint-placeholder-val="{{ false }}">
    <ellipse cx="50" cy="69" rx="4.5" ry="5.5" fill="#7A1F10" stroke="#1B1F5E" stroke-width="2"/>
  </sc-if>
  <sc-if value="{{showL}}" hint-placeholder-val="{{ false }}">
    <path d="M41 65 Q50 76 59 65 Z" fill="#7A1F10" stroke="#1B1F5E" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="50" cy="66.5" rx="5" ry="3" fill="#FF8FA3"/>
  </sc-if>
  <sc-if value="{{showTH}}" hint-placeholder-val="{{ false }}">
    <rect x="40" y="65" width="20" height="6" rx="2" fill="#fff" stroke="#1B1F5E" stroke-width="2"/>
    <ellipse cx="50" cy="73" rx="7.5" ry="6" fill="#FF8FA3" stroke="#1B1F5E" stroke-width="2"/>
    <path d="M50 70 v6" stroke="#D9587A" stroke-width="1.6" stroke-linecap="round"/>
  </sc-if>
  <sc-if value="{{showV}}" hint-placeholder-val="{{ false }}">
    <path d="M40 68 Q50 75 60 68" fill="none" stroke="#1B1F5E" stroke-width="3" stroke-linecap="round"/>
    <path d="M43 66 h5 l-2.5 6.5 z M52 66 h5 l-2.5 6.5 z" fill="#fff" stroke="#1B1F5E" stroke-width="2" stroke-linejoin="round"/>
  </sc-if>
  <sc-if value="{{showF}}" hint-placeholder-val="{{ false }}">
    <ellipse cx="50" cy="69" rx="3.8" ry="4.4" fill="#1B1F5E"/>
    <path d="M60 69 q8 1 14 -2 M60 74 q9 3 15 1" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </sc-if>
  <sc-if value="{{showB}}" hint-placeholder-val="{{ false }}">
    <ellipse cx="50" cy="69" rx="8" ry="3.2" fill="#C2185B" stroke="#1B1F5E" stroke-width="2"/>
    <ellipse cx="22" cy="67" rx="8" ry="6" fill="#FFB3C7"/><ellipse cx="78" cy="67" rx="8" ry="6" fill="#FFB3C7"/>
  </sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"type":{"editor":"enum","options":["r","l","th","v","f","b"],"default":"r"},"size":{"editor":"int","default":96},"locked":{"editor":"text","default":"no"},"mouth":{"editor":"enum","options":["rest","show","joy"],"default":"rest"},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.type || 'r';
    const m = this.props.mouth || 'rest';
    const size = Number(this.props.size || 96);
    const locked = this.props.locked === 'yes';
    const colors = { r: '#FF7A59', l: '#54C2F0', th: '#C79BFF', v: '#FFB020', f: '#3DDBB3', b: '#FFF1D0' };
    const rest = !locked && m === 'rest';
    const show = !locked && m === 'show';
    return {
      px: size + 'px',
      body: locked ? '#C9CDE0' : (colors[t] || '#FF7A59'),
      leaf: locked ? '#DDE0EE' : '#A6F3DF',
      accent: locked ? '#DDE0EE' : '#FF8FA3',
      locked: locked,
      open: !locked,
      tR: t === 'r',
      tL: t === 'l',
      tTH: t === 'th',
      tV: t === 'v',
      tF: t === 'f',
      tB: t === 'b',
      isRest: rest,
      isJoy: !locked && m === 'joy',
      restTH: rest && t === 'th',
      restV: rest && t === 'v',
      restB: rest && t === 'b',
      showR: show && t === 'r',
      showL: show && t === 'l',
      showTH: show && t === 'th',
      showV: show && t === 'v',
      showF: show && t === 'f',
      showB: show && t === 'b'
    };
  }
}
</script>
</body>
</html>
