  <!-- Speech shape -->
  <path fill="#FFFFFF" d="M362 190 H662 A170 170 0 0 1 832 360 V548 A170 170 0 0 1 662 718 H468 L292 838 L326 718 H362 A170 170 0 0 1 192 548 V360 A170 170 0 0 1 362 190 Z"/>
  <!-- Two separated sound waves, opposite phase: "hear the difference" -->
  <path d="M316 366 q49 -90 98 0 t98 0 t98 0 t98 0" fill="none" stroke="#3D42C9" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M316 548 q49 90 98 0 t98 0 t98 0 t98 0" fill="none" stroke="#12B5A4" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
