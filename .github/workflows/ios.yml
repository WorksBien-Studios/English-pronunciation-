name: iOS build and test

on:
  pull_request:
    paths:
      - "ios/**"
      - "pronunciation-engine/**"
      - "scripts/generate_xcodeproj.py"
      - "scripts/fetch_pronunciation_model.sh"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "pronunciation-engine/**"
      - "scripts/generate_xcodeproj.py"
      - "scripts/fetch_pronunciation_model.sh"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: iOS build and test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify locked pronunciation model
        run: scripts/fetch_pronunciation_model.sh

      - name: Xcode project matches the source tree
        run: python3 scripts/generate_xcodeproj.py --check

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Select iPhone and iPad simulators (iOS 18 or later)
        run: |
          xcrun simctl list devices available
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          xcrun --sdk iphonesimulator --show-sdk-version > "$RUNNER_TEMP/simulator-sdk-version"
          python3 - "$RUNNER_TEMP/simulators.json" "$RUNNER_TEMP/simulator-sdk-version" >> "$GITHUB_ENV" <<'PY'
          import json, re, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          sdk_version = tuple(map(int, open(sys.argv[2]).read().strip().split(".")[:2]))
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for family, key in (("iPhone", "IPHONE_SIMULATOR"), ("iPad", "IPAD_SIMULATOR")):
              candidates = []
              for runtime, entries in devices.items():
                  runtime_version = version(runtime)
                  if runtime_version != sdk_version:
                      continue
                  for device in entries:
                      if device["name"].startswith(family) and device.get("isAvailable", True):
                          candidates.append((device["name"], device["udid"]))
              if not candidates:
                  raise SystemExit(
                      f"No available {family} simulator matching active SDK iOS "
                      f"{sdk_version[0]}.{sdk_version[1]}"
                  )
              print(f"{key}={sorted(candidates)[-1][1]}")
          PY

      - name: Build for simulator tests
        run: |
          set -o pipefail
          xcodebuild -project ios/EnglishPronunciationCoach.xcodeproj -scheme EnglishPronunciationCoach \
            -destination "platform=iOS Simulator,id=$IPHONE_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/iphone-build.log"

      - name: Validate simulator app metadata
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/EnglishPronunciationCoach.app"
          plist="$app/Info.plist"
          test -f "$plist"
          plutil -p "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.worksbienstudios.englishpronunciationcoach"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")" = "EnglishPronunciationCoach"
          find "$app" -type f -name Info.plist -print | while read -r nested_plist; do
            echo "Inspecting $nested_plist"
            plutil -p "$nested_plist"
          done
          if test -f "$app/Frameworks/onnxruntime.framework/onnxruntime"; then
            file "$app/Frameworks/onnxruntime.framework/onnxruntime"
          fi

      - name: Ad hoc sign simulator test bundle
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/EnglishPronunciationCoach.app"
          find "$app" -maxdepth 1 -type f -name '*.png' -exec chmod 0644 {} +
          xattr -cr "$app"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Diagnose simulator install (temporary)
        continue-on-error: true
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/EnglishPronunciationCoach.app"
          {
            echo "== top level"; ls -la "$app"
            echo "== every directory (depth<=3)"; find "$app" -maxdepth 3 -type d | sort
            echo "== bundle-like dirs and Info.plist ids"
            find "$app" -type d \( -name '*.bundle' -o -name '*.framework' -o -name '*.xctest' -o -name '*.appex' -o -name '*.app' -o -name '*.xcframework' \) | sort | while read -r d; do
              if test -f "$d/Info.plist"; then echo "$d -> $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$d/Info.plist" 2>&1)"; else echo "$d -> NO Info.plist"; fi
            done
            echo "== every Info.plist and its bundle id"
            find "$app" -name Info.plist | sort | while read -r f; do echo "$f -> $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$f" 2>&1)"; done
            echo "== code signature"; codesign -dvvv "$app" 2>&1 | head -30
            echo "== simctl install (device $IPHONE_SIMULATOR)"
            xcrun simctl boot "$IPHONE_SIMULATOR" 2>&1 || true
            xcrun simctl bootstatus "$IPHONE_SIMULATOR" 2>&1 | tail -3 || true
            xcrun simctl install "$IPHONE_SIMULATOR" "$app" 2>&1; echo "simctl install exit: $?"
            echo "== install with the .xctest removed from PlugIns (isolation)"
            copy="$RUNNER_TEMP/app-noxctest/EnglishPronunciationCoach.app"
            rm -rf "$RUNNER_TEMP/app-noxctest"; mkdir -p "$RUNNER_TEMP/app-noxctest"; cp -R "$app" "$copy"
            rm -rf "$copy/PlugIns/EnglishPronunciationCoachTests.xctest"
            xcrun simctl install "$IPHONE_SIMULATOR" "$copy" 2>&1; echo "simctl install (no xctest) exit: $?"
            echo "== install with model + engine Resources removed (isolation)"
            copy2="$RUNNER_TEMP/app-nodata/EnglishPronunciationCoach.app"
            rm -rf "$RUNNER_TEMP/app-nodata"; mkdir -p "$RUNNER_TEMP/app-nodata"; cp -R "$app" "$copy2"
            rm -rf "$copy2/PlugIns/EnglishPronunciationCoachTests.xctest" "$copy2/model_q4f16.onnx" "$copy2/Resources"
            codesign --force --deep --sign - --timestamp=none "$copy2" 2>&1 | tail -2
            xcrun simctl install "$IPHONE_SIMULATOR" "$copy2" 2>&1; echo "simctl install (no xctest, no data) exit: $?"
          } 2>&1 | tee "$RUNNER_TEMP/diagnose.log"

      - name: Test on iPhone
        run: |
          set -o pipefail
          xcodebuild -project ios/EnglishPronunciationCoach.xcodeproj -scheme EnglishPronunciationCoach \
            -destination "platform=iOS Simulator,id=$IPHONE_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -parallel-testing-enabled NO \
            test-without-building 2>&1 | tee "$RUNNER_TEMP/iphone.log"

      - name: Test on iPad
        run: |
          set -o pipefail
          xcodebuild -project ios/EnglishPronunciationCoach.xcodeproj -scheme EnglishPronunciationCoach \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -parallel-testing-enabled NO \
            test-without-building 2>&1 | tee "$RUNNER_TEMP/ipad.log"

      - name: Release build (Release configuration, generic iOS device, unsigned)
        id: release
        if: always()
        run: |
          set -o pipefail
          xcodebuild -project ios/EnglishPronunciationCoach.xcodeproj -scheme EnglishPronunciationCoach \
            -configuration Release -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataRelease" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/release.log"

      - name: Privacy manifest is in the built app
        if: ${{ always() && steps.release.outcome == 'success' }}
        run: |
          app="$(find "$RUNNER_TEMP/DerivedDataRelease/Build/Products" -maxdepth 2 -type d -name 'EnglishPronunciationCoach.app' -print -quit)"
          test -n "$app"
          test -f "$app/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Info.plist"
          test -f "$app/model_q4f16.onnx"
          echo '9978e7cba1bf721699b2cb673be461ccf09f6ef5dfc257f2f6ed2c4113d4e54c  '"$app/model_q4f16.onnx" | shasum -a 256 -c -
          test -f "$app/Resources/phonemes.json"
          test -f "$app/Resources/model-output-map.json"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/iphone-build.log
            ${{ runner.temp }}/iphone.log
            ${{ runner.temp }}/ipad.log
            ${{ runner.temp }}/release.log
            ${{ runner.temp }}/diagnose.log
          if-no-files-found: ignore
