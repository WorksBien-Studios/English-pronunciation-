name: iOS build and test

on:
  pull_request:
    paths:
      - "ios/**"
      - "pronunciation-engine/**"
      - "scripts/generate_xcodeproj.py"
      - "scripts/fetch_pronunciation_model.py"
      - "scripts/validate_stage_engine_content.py"
      - "scripts/bundle_pronunciation_engine.sh"
      - "scripts/fix_onnxruntime_minimum_os.sh"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "pronunciation-engine/**"
      - "scripts/generate_xcodeproj.py"
      - "scripts/fetch_pronunciation_model.py"
      - "scripts/validate_stage_engine_content.py"
      - "scripts/bundle_pronunciation_engine.sh"
      - "scripts/fix_onnxruntime_minimum_os.sh"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: iOS build and test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate stage and engine content agree
        run: python3 scripts/validate_stage_engine_content.py

      - name: Cache locked pronunciation model
        uses: actions/cache@v4
        with:
          path: pronunciation-engine/model/model_q4f16.onnx
          key: pronunciation-model-q4f16-9978e7cba1bf7216

      - name: Fetch and verify locked pronunciation model
        run: python3 scripts/fetch_pronunciation_model.py

      - name: Generate Xcode project
        run: python3 scripts/generate_xcodeproj.py

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Select iPhone and iPad simulators (iOS 18 or later)
        run: |
          xcrun simctl list devices available
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_ENV" <<'PY'
          import json, re, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for family, key in (("iPhone", "IPHONE_SIMULATOR"), ("iPad", "IPAD_SIMULATOR")):
              candidates = []
              for runtime, entries in devices.items():
                  if version(runtime)[0] < 18:
                      continue
                  for device in entries:
                      if device["name"].startswith(family) and device.get("isAvailable", True):
                          candidates.append((version(runtime), device["name"], device["udid"]))
              if not candidates:
                  raise SystemExit(f"No available {family} simulator on iOS 18 or later")
              print(f"{key}={sorted(candidates)[-1][2]}")
          PY

      - name: Build and test on iPhone
        run: |
          set -o pipefail
          xcodebuild -project ios/EnglishPronunciationCoach.xcodeproj -scheme EnglishPronunciationCoach \
            -destination "platform=iOS Simulator,id=$IPHONE_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/iphone.log"

      - name: Test on iPad
        run: |
          set -o pipefail
          xcodebuild -project ios/EnglishPronunciationCoach.xcodeproj -scheme EnglishPronunciationCoach \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/ipad.log"

      - name: Release build (Release configuration, generic iOS device, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/EnglishPronunciationCoach.xcodeproj -scheme EnglishPronunciationCoach \
            -configuration Release -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataRelease" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/release.log"

      - name: Privacy manifest is in the built app
        run: |
          app="$(find "$RUNNER_TEMP/DerivedDataRelease/Build/Products" -maxdepth 2 -type d -name 'EnglishPronunciationCoach.app' -print -quit)"
          test -n "$app"
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$app/PronunciationEngineResources/phonemes.json"
          test -f "$app/PronunciationEngineResources/practice-words.json"
          python3 scripts/fetch_pronunciation_model.py \
            --destination "$app/PronunciationEngineResources/model_q4f16.onnx" --verify-only
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Info.plist"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/iphone.log
            ${{ runner.temp }}/ipad.log
            ${{ runner.temp }}/release.log
          if-no-files-found: ignore
